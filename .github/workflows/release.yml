name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    strategy:
      matrix:
        platform:
          - windows-latest
          - ubuntu-22.04

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }} # Set manually in repository settings.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }} # Set manually in repository settings.
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Cubic Launcher ${{ github.ref_name }}
          releaseBody: |
            Fixed: Microsoft login silently fell back to offline mode and could not recover — the rotated refresh token is now stored correctly, and any authentication failure is reported instead of hidden.
            Fixed: mod version selection now prefers stable releases; alpha and beta builds are only used when a mod publishes nothing else.
            Updates install only after your confirmation.
          releaseDraft: true
          includeUpdaterJson: true
